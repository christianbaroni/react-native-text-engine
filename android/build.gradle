def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def toPlatformFileString(String path) {
    if (org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)) {
        return path.replace(File.separatorChar, '/' as char)
    }
    return path
}

def resolveReactNativeWorkletsDirectory() {
    try {
        def workletsPackage = file(
            providers.exec {
                workingDir(rootDir)
                commandLine(resolveNodeExecutable(), "--print", "require.resolve('react-native-worklets/package.json')")
            }.standardOutput.asText.get().trim()
        )
        return workletsPackage.exists() ? workletsPackage.parentFile : null
    } catch (ignored) {
        return null
    }
}

def resolveReactNativeDirectory() {
    try {
        def reactNativePackage = file(
            providers.exec {
                workingDir(rootDir)
                commandLine(resolveNodeExecutable(), "--print", "require.resolve('react-native/package.json')")
            }.standardOutput.asText.get().trim()
        )
        return reactNativePackage.exists() ? reactNativePackage.parentFile : null
    } catch (ignored) {
        return null
    }
}

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def resolveNodeExecutable() {
    return System.getenv("NODE_BINARY") ?: "node"
}

def textComparisonEnabled = project.findProperty('rnteTextComparison') == 'true'
def reactRuntimeLibraries = ["**/libc++_shared.so", "**/libjsi.so", "**/libreactnative.so", "**/libworklets.so"]

def reactNativeRootDir = resolveReactNativeDirectory()
def reactNativeWorkletsRootDir = resolveReactNativeWorkletsDirectory()
def reactNativeArchitectures = (project.findProperty("reactNativeArchitectures")
        ?: "armeabi-v7a,x86,x86_64,arm64-v8a").split(",")

apply plugin: 'com.facebook.react'

android {
    namespace "com.rntextengine"
    compileSdkVersion safeExtGet('compileSdkVersion', 33)

    buildFeatures {
        prefab true
    }

    packaging {
        jniLibs.excludes += reactRuntimeLibraries
    }

    // Used to override the NDK path/version on internal CI or by allowing
    // users to customize the NDK path/version from their root project.
    if (rootProject.hasProperty("ndkPath")) {
        ndkPath rootProject.ext.ndkPath
    }
    if (rootProject.hasProperty("ndkVersion")) {
        ndkVersion rootProject.ext.ndkVersion
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 33)
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
        testInstrumentationRunner textComparisonEnabled ? "androidx.test.runner.AndroidJUnitRunner" : "androidx.benchmark.junit4.AndroidBenchmarkRunner"
        testInstrumentationRunnerArguments["androidx.benchmark.suppressErrors"] = "EMULATOR"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DRNTEXTENGINE_BUILD_TEXT_COMPARISON=${textComparisonEnabled ? 'ON' : 'OFF'}",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DANDROID_STL=c++_shared",
                        "-DREACT_NATIVE_DIR=${reactNativeRootDir ? toPlatformFileString(reactNativeRootDir.path) : ''}",
                        "-DREACT_NATIVE_WORKLETS_DIR=${reactNativeWorkletsRootDir ? toPlatformFileString(reactNativeWorkletsRootDir.path) : ''}"
                abiFilters(*reactNativeArchitectures)
            }
        }
    }

    testBuildType "release"

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/fabric']
            } else {
                java.srcDirs += ['src/paper']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def test = variant.androidTest
        if (test != null) {
            test.packaging.jniLibs.excludes.set(providers.provider { android.packaging.jniLibs.excludes - reactRuntimeLibraries })
            test.packaging.jniLibs.pickFirsts.addAll(reactRuntimeLibraries + ["**/libfbjni.so"])
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    // The shipped Android classes subclass React Android runtime types, so consumers need the
    // runtime dependency on their packaging/instrumentation classpath as well, not just compile.
    implementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    if (project != rootProject && rootProject.subprojects.find { it.name == "react-native-worklets" }) {
        implementation project(":react-native-worklets")
    }
    androidTestImplementation "androidx.benchmark:benchmark-junit4:1.4.1"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}

if (project != rootProject) {
    def workletsProject = rootProject.subprojects.find { it.name == "react-native-worklets" }
    if (workletsProject != null) {
        evaluationDependsOn(":react-native-worklets")

        afterEvaluate {
            tasks.named("externalNativeBuildDebug").configure {
                dependsOn(workletsProject.tasks.named("externalNativeBuildDebug"))
            }
            tasks.named("externalNativeBuildRelease").configure {
                dependsOn(workletsProject.tasks.named("externalNativeBuildRelease"))
            }
        }
    }
}

def syncTextEngineDefaults = tasks.register("syncTextEngineDefaults", Exec) {
    def packageRoot = projectDir.parentFile
    def appRoot = rootProject.projectDir.parentFile

    workingDir(appRoot)
    commandLine(
            resolveNodeExecutable(),
            new File(packageRoot, "scripts/sync-text-engine-config.mjs").absolutePath,
            "--app-root",
            appRoot.absolutePath,
            "--package-root",
            packageRoot.absolutePath,
    )
}

def overlayFabricTextViewCodegenOverrides = tasks.register("overlayFabricTextViewCodegenOverrides", Copy) {
    dependsOn("generateCodegenArtifactsFromSchema")

    from("src/main/jni") {
        include "RNTextEngineBindings.h"
    }

    from("src/main/jni/react/renderer/components/RNTextEngineSpec") {
        into "react/renderer/components/RNTextEngineSpec"
        include "ComponentDescriptors.h"
        include "ShadowNodes.h"
        include "RNTextEngineTextViewShadowNode.h"
        include "RNTextEngineTextViewShadowNode.cpp"
    }

    into(layout.buildDirectory.dir("generated/source/codegen/jni"))
}

preBuild.dependsOn(syncTextEngineDefaults)

if (isNewArchitectureEnabled()) {
    preBuild.dependsOn(overlayFabricTextViewCodegenOverrides)
}

if (textComparisonEnabled) {
    tasks.configureEach { task ->
        if (task.name.startsWith("configureCMake")) {
            task.dependsOn(overlayFabricTextViewCodegenOverrides)
        }
    }
}
