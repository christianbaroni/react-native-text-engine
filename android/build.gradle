def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def toPlatformFileString(String path) {
    if (org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)) {
        return path.replace(File.separatorChar, '/' as char)
    }
    return path
}

def resolveReactNativeWorkletsDirectory() {
    try {
        def workletsPackage = file(
            providers.exec {
                workingDir(rootDir)
                commandLine("node", "--print", "require.resolve('react-native-worklets/package.json')")
            }.standardOutput.asText.get().trim()
        )
        return workletsPackage.exists() ? workletsPackage.parentFile : null
    } catch (ignored) {
        return null
    }
}

def resolveReactNativeDirectory() {
    try {
        def reactNativePackage = file(
            providers.exec {
                workingDir(rootDir)
                commandLine("node", "--print", "require.resolve('react-native/package.json')")
            }.standardOutput.asText.get().trim()
        )
        return reactNativePackage.exists() ? reactNativePackage.parentFile : null
    } catch (ignored) {
        return null
    }
}

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def reactNativeRootDir = resolveReactNativeDirectory()
def reactNativeWorkletsRootDir = resolveReactNativeWorkletsDirectory()

if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace "com.rnpretext"
    compileSdkVersion safeExtGet('compileSdkVersion', 33)

    buildFeatures {
        prefab true
    }

    // Used to override the NDK path/version on internal CI or by allowing
    // users to customize the NDK path/version from their root project.
    if (rootProject.hasProperty("ndkPath")) {
        ndkPath rootProject.ext.ndkPath
    }
    if (rootProject.hasProperty("ndkVersion")) {
        ndkVersion rootProject.ext.ndkVersion
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 33)
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString())
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DANDROID_STL=c++_shared",
                        "-DREACT_NATIVE_DIR=${reactNativeRootDir ? toPlatformFileString(reactNativeRootDir.path) : ''}",
                        "-DREACT_NATIVE_WORKLETS_DIR=${reactNativeWorkletsRootDir ? toPlatformFileString(reactNativeWorkletsRootDir.path) : ''}"
            }
        }
    }

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += [
                        'src/fabric',
                        // Codegen output directory
                        project.file("${project.buildDir}/generated/source/codegen/java")
                ]
            } else {
                java.srcDirs += ['src/paper']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    compileOnly "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
}
